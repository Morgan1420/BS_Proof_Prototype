[pytest]
testpaths = tests
filterwarnings =
    # google-genai's own internals touch a private typing alias
    # (_UnionGenericAlias) that Python 3.14 has started warning about ahead of
    # its 3.17 removal. Inside the installed SDK, not our code -- no fix
    # available on our end short of the SDK releasing an update. Matched by
    # module (any google.genai.* submodule) rather than message text so this
    # covers the warning regardless of its exact wording across SDK versions.
    ignore::DeprecationWarning:google\.genai.*
    # Starlette's TestClient warns on every use of legacy httpx instead of its
    # newer httpx2 client. The warning class lives in starlette.exceptions --
    # NOT starlette.types, which has no such class and would break pytest's
    # own startup (an unresolvable dotted category name is a hard config
    # error, not a silent skip). Real fix if you want to clear this for good:
    #     pip install httpx2
    ignore::starlette.exceptions.StarletteDeprecationWarning
    # Message-based match as a second net for the specific httpx/httpx2
    # warning text, independent of the category-based filter above.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
